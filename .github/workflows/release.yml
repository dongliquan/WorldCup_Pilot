# Release build: push a tag like v1.0.0 and the single-file Windows exe is built on GitHub's runner and attached to a
# DRAFT GitHub Release (nothing is public until you press "Publish release").
# The exe is unsigned. To sign it later, add a code-signing step before the upload.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bash .github/ci-step.sh "install" python -m pip install -r requirements.txt
        shell: bash
      - run: bash .github/ci-step.sh "model consistency test" python test_model_consistency.py
        shell: bash
      - run: bash .github/ci-step.sh "pyinstaller" python -m PyInstaller --noconfirm worldcup_win.spec
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: WorldCupPilot-windows
          path: dist/WorldCupPilot.exe
          if-no-files-found: error
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          draft: true
          files: dist/WorldCupPilot.exe
